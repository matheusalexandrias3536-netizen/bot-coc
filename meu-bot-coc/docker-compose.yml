services:
  bot-coc:
    build: .
    container_name: bot-coc
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - PORT=5000
    ports:
      - "5000:5000"
    volumes:
      - bot_coc_data:/app/data

volumes:
  bot_coc_data:
    name: bot_coc_data
